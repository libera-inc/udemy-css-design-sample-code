        <main class="u-ptb l-container-s">
            <h1 class="c-title-level1">お問い合わせ</h1>
            <p class="contact-note">お問い合わせは下記のフォーム、もしくはお電話にて承ります。</p>

            <form action="" class="contact-form">
                <div class="contact-item">
                    <label for="company-name" class="contact-label">法人名</label>
                    <input id="company-name" type="text" class="c-form-text" placeholder="株式会社ABC" />
                </div>

                <div class="contact-item">
                    <label for="name" class="contact-label">お名前</label>
                    <input id="name" type="text" class="c-form-text" placeholder="山田 太郎" />
                </div>

                <div class="contact-item">
                    <label for="email" class="contact-label">メールアドレス</label>
                    <input id="email" type="email" class="c-form-text" placeholder="taro@example.com" />
                </div>

                <div class="contact-item">
                    <label for="contact-content" class="contact-label">お問い合わせ内容</label>
                    <textarea id="contact-content" class="c-form-text c-form-text--textarea contact-textarea" placeholder="お問い合わせ内容をご入力ください。"></textarea>
                </div>

                <div class="contact-button-wrap">
                    <button class="c-button">送信する</button>
                </div>
            </form>
